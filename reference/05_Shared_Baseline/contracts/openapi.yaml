          - leased
          - running
          - cancel_requested
          - succeeded
          - failed
          - timed_out
          - cancelled
          - failed_unknown_effect
        attempt:
          type: integer
          minimum: 0
        revision:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        result_id:
          type:
          - string
          - 'null'
          format: uuid
        error_code:
          type:
          - string
          - 'null'
      required:
      - id
      - project_id
