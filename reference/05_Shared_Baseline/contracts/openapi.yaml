      - state
      - revoked_at
      - purge_deadline
      - affected_artifacts
      additionalProperties: false
    EventPayload:
      type: object
      properties:
        operation_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        outcome:
          type: string
          enum:
          - success
          - failure
          - unknown
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        content_artifact_id:
          type: string
          format: uuid
        redacted:
          type: boolean
        reason:
          type: string
          maxLength: 500
        missing_sequence_start:
          type: integer
          minimum: 0
        missing_sequence_end:
          type: integer
          minimum: 0
      required: []
      additionalProperties: false
    Event:
      type: object
      properties:
        schema_version:
          const: afr-event/1
        event_id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        producer_id:
          type: string
          minLength: 1
          maxLength: 100
        producer_seq:
          type: integer
          minimum: 0
        event_type:
          type: string
          enum:
          - run.started
          - run.finished
          - model.requested
          - model.responded
          - tool.requested
          - tool.responded
          - tool.failed
          - capture.dropped
          - approval.decided
        observed_at:
          type: string
          format: date-time
        capture_policy_id:
          type: string
          format: uuid
        parent_event_id:
          type:
          - string
          - 'null'
          format: uuid
        payload:
          $ref: '#/components/schemas/EventPayload'
      required:
      - schema_version
      - event_id
      - run_id
      - producer_id
      - producer_seq
      - event_type
      - observed_at
      - capture_policy_id
      - payload
      additionalProperties: false
    EventBatch:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
          minItems: 1
          maxItems: 500
      required:
      - events
      additionalProperties: false
    BatchReceipt:
      type: object
      properties:
        accepted:
          type: array
          items:
            type: string
            format: uuid
        duplicates:
          type: array
          items:
            type: string
            format: uuid
        request_id:
          type: string
          format: uuid
      required:
      - accepted
      - duplicates
      - request_id
      additionalProperties: false
    Run:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - recording
          - completed
          - failed
          - abandoned
        revision:
          type: integer
          minimum: 1
        event_count:
          type: integer
          minimum: 0
        completeness:
          type: array
          items:
            type: string
            enum:
            - sequence_gap
            - missing_terminal
            - orphan
            - content_not_captured
            - truncated
          uniqueItems: true
        verified_outcome:
          type: string
          enum:
          - unscored
          - pass
          - fail
          - error
        created_at:
          type: string
          format: date-time
