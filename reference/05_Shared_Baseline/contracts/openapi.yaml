  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          enum:
          - invalid
          - unauthenticated
          - forbidden
          - not_found
          - conflict
          - precondition_failed
          - too_large
          - unsupported_media
          - quota
          - unavailable
          - mode_disabled
        detail:
          type: string
          maxLength: 1000
        request_id:
          type: string
          format: uuid
        field_errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              code:
                type: string
            required:
            - path
            - code
            additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - detail
      - request_id
      additionalProperties: false
    Empty:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    PageQuery:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        cursor:
          type: string
          maxLength: 2048
      required: []
      additionalProperties: false
    Actor:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
            enum:
            - viewer
            - analyst
            - operator
            - maintainer
            - admin
          minItems: 1
          uniqueItems: true
      required:
      - user_id
      - organization_id
      - roles
      additionalProperties: false
    ProjectCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        content_capture:
          type: string
          enum:
          - metadata_only
          - redacted
        external_transfer:
          type: boolean
      required:
      - name
      - content_capture
      - external_transfer
      additionalProperties: false
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        content_capture:
          type: string
          enum:
          - metadata_only
          - redacted
        external_transfer:
          type: boolean
        revision:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - content_capture
      - external_transfer
      - revision
      - created_at
      additionalProperties: false
    UploadCreate:
      type: object
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 200
        media_type:
          type: string
          enum:
          - application/pdf
          - application/json
          - application/zip
          - text/plain
        byte_size:
          type: integer
          minimum: 1
          maximum: 104857600
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        classification:
          type: string
          enum:
          - synthetic
          - public_authorized
          - sensitive
      required:
      - filename
      - media_type
      - byte_size
      - sha256
      - classification
      additionalProperties: false
    Upload:
      type: object
      properties:
        id:
          type: string
          format: uuid
        artifact_id:
          type: string
          format: uuid
        put_path:
          type: string
          pattern: ^/api/v1/
        expires_at:
          type: string
          format: date-time
        maximum_bytes:
          type: integer
          minimum: 1
      required:
      - id
      - artifact_id
      - put_path
      - expires_at
      - maximum_bytes
      additionalProperties: false
    UploadFinalize:
      type: object
      properties:
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        byte_size:
          type: integer
          minimum: 1
      required:
      - sha256
      - byte_size
      additionalProperties: false
    Artifact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        byte_size:
          type: integer
          minimum: 1
        media_type:
          type: string
        status:
          type: string
          enum:
          - pending
          - ready
          - quarantined
          - deleting
          - deleted
        classification:
          type: string
          enum:
          - synthetic
          - public_authorized
          - sensitive
        created_at:
          type: string
          format: date-time
      required:
      - id
      - project_id
      - sha256
      - byte_size
      - media_type
      - status
      - classification
      - created_at
      additionalProperties: false
    Job:
      type: object
      properties:
