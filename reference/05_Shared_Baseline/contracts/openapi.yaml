    Deletion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - requested
          - revoked
          - purging
          - complete
          - failed
        revoked_at:
          type: string
          format: date-time
        purge_deadline:
          type: string
          format: date-time
        affected_artifacts:
          type: integer
          minimum: 0
      required:
