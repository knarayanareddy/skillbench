components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-baseline-session
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          enum:
          - invalid
          - unauthenticated
          - forbidden
          - not_found
          - conflict
          - precondition_failed
          - too_large
          - unsupported_media
          - quota
          - unavailable
          - mode_disabled
        detail:
          type: string
          maxLength: 1000
        request_id:
          type: string
          format: uuid
        field_errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              code:
                type: string
            required:
            - path
            - code
            additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - detail
      - request_id
      additionalProperties: false
    Empty:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    ProjectCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        content_capture:
          type: string
          enum:
          - metadata_only
          - redacted
        external_transfer:
          type: boolean
      required:
      - name
      - content_capture
      - external_transfer
      additionalProperties: false
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        content_capture:
          type: string
          enum:
          - metadata_only
          - redacted
        external_transfer:
          type: boolean
        revision:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - content_capture
      - external_transfer
      - revision
      - created_at
      additionalProperties: false
    UploadCreate:
      type: object
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 200
        media_type:
          type: string
          enum:
          - application/pdf
          - application/json
          - application/zip
          - text/plain
        byte_size:
          type: integer
          minimum: 1
          maximum: 104857600
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        classification:
          type: string
          enum:
          - synthetic
          - public_authorized
          - sensitive
      required:
      - filename
      - media_type
      - byte_size
      - sha256
      - classification
      additionalProperties: false
    Upload:
      type: object
      properties:
        id:
          type: string
          format: uuid
        artifact_id:
          type: string
          format: uuid
        put_path:
          type: string
          pattern: ^/api/v1/
        expires_at:
          type: string
          format: date-time
        maximum_bytes:
          type: integer
          minimum: 1
      required:
      - id
      - artifact_id
      - put_path
      - expires_at
      - maximum_bytes
      additionalProperties: false
    UploadFinalize:
      type: object
      properties:
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        byte_size:
          type: integer
          minimum: 1
      required:
      - sha256
      - byte_size
      additionalProperties: false
    Artifact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        byte_size:
          type: integer
          minimum: 1
        media_type:
          type: string
        status:
          type: string
          enum:
          - pending
          - ready
          - quarantined
          - deleting
          - deleted
        classification:
          type: string
          enum:
          - synthetic
          - public_authorized
          - sensitive
        created_at:
          type: string
          format: date-time
      required:
      - id
      - project_id
      - sha256
      - byte_size
      - media_type
      - status
      - classification
      - created_at
      additionalProperties: false
    Job:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        kind:
          type: string
        state:
          type: string
          enum:
          - queued
          - leased
          - running
          - cancel_requested
          - succeeded
          - failed
          - timed_out
          - cancelled
          - failed_unknown_effect
        attempt:
          type: integer
          minimum: 0
        revision:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        result_id:
          type:
          - string
          - 'null'
          format: uuid
        error_code:
          type:
          - string
          - 'null'
      required:
      - id
      - project_id
      - kind
      - state
      - attempt
      - revision
      - created_at
      - result_id
      - error_code
      additionalProperties: false
    PackageCreate:
      type: object
      properties:
        artifact_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        source_commit:
          type: string
          pattern: ^[a-f0-9]{40}$
        license_expression:
          type: string
          maxLength: 200
      required:
      - artifact_id
      - name
      additionalProperties: false
    Package:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        artifact_id:
          type: string
          format: uuid
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        state:
          type: string
          enum:
          - quarantined
          - inspected
          - approved
          - rejected
        execution_profile:
          const: fixture_only
        revision:
          type: integer
          minimum: 1
      required:
      - id
      - project_id
      - artifact_id
      - sha256
      - state
      - execution_profile
      - revision
      additionalProperties: false
    PackageReview:
      type: object
      properties:
        decision:
          type: string
          enum:
          - approved
          - rejected
        package_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        reason:
          type: string
          minLength: 5
          maxLength: 1000
      required:
      - decision
      - package_sha256
      - reason
      additionalProperties: false
    Task:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
        category:
          type: string
          maxLength: 100
        input_artifact_id:
          type: string
          format: uuid
        split:
          type: string
          enum:
          - development
          - validation
          - holdout
        scorer_id:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - id
      - category
      - input_artifact_id
      - split
      - scorer_id
      additionalProperties: false
    SuiteCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
          minItems: 1
          maxItems: 1000
        rights_manifest_artifact_id:
          type: string
          format: uuid
      required:
      - name
      - tasks
      - rights_manifest_artifact_id
      additionalProperties: false
    Suite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        version:
          type: integer
          minimum: 1
        task_count:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
      required:
      - id
      - project_id
      - sha256
      - version
      - task_count
      - created_at
      additionalProperties: false
    PlanCreate:
      type: object
      properties:
        package_id:
          type: string
          format: uuid
        package_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        suite_id:
          type: string
          format: uuid
        suite_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        harness:
          const: fixture/1
        model:
          const: recorded/1
        repetitions:
          type: integer
          minimum: 1
          maximum: 20
        seed:
          type: integer
          minimum: 0
        bootstrap_iterations:
          type: integer
          minimum: 100
          maximum: 10000
        practical_margin:
          type: number
          minimum: 0
          maximum: 1
        primary_metric:
          const: task_mean_success_delta
        missing_rule:
          const: report_bounds_no_silent_drop
        mode:
          const: fixture_only
      required:
      - package_id
      - package_sha256
      - suite_id
      - suite_sha256
      - harness
      - model
      - repetitions
      - seed
      - bootstrap_iterations
      - practical_margin
      - primary_metric
      - missing_rule
      - mode
      additionalProperties: false
    Plan:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        state:
          type: string
          enum:
          - draft
          - preregistered
        revision:
          type: integer
          minimum: 1
        definition:
          $ref: '#/components/schemas/PlanCreate'
        created_at:
          type: string
          format: date-time
      required:
      - id
      - project_id
      - sha256
      - state
      - revision
      - definition
      - created_at
      additionalProperties: false
    Trial:
      type: object
      properties:
        task_id:
          type: string
        repeat:
          type: integer
          minimum: 0
        arm:
          type: string
          enum:
          - baseline
          - treatment
        outcome:
          type: string
          enum:
          - pass
          - fail
          - infra_error
          - policy_block
          - activation_failed
          - cancelled
        cost:
          anyOf:
          - type: string
            pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
          - type: 'null'
        currency:
          const: EUR
        attempt:
          type: integer
          minimum: 1
        trace_artifact_id:
          type: string
          format: uuid
      required:
      - task_id
      - repeat
      - arm
      - outcome
      - cost
      - currency
      - attempt
      additionalProperties: false
    ExperimentCreate:
      type: object
      properties:
        plan_id:
          type: string
          format: uuid
        plan_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
      required:
      - plan_id
      - plan_sha256
      additionalProperties: false
    Experiment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
        plan_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        state:
          type: string
          enum:
          - queued
          - running
          - completed
          - stopped
          - failed
        job_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
      required:
      - id
      - project_id
      - plan_id
      - plan_sha256
      - state
      - job_id
      - created_at
      additionalProperties: false
    Analysis:
      type: object
      properties:
        id:
          type: string
          format: uuid
        experiment_id:
          type: string
          format: uuid
        analysis_version:
          const: paired-task-bootstrap/1
        input_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        status:
          type: string
          enum:
          - valid
          - partial
          - insufficient
        n_tasks:
          type: integer
          minimum: 0
        n_complete_tasks:
          type: integer
          minimum: 0
        delta:
          type:
          - number
          - 'null'
          minimum: -1
          maximum: 1
        ci_low:
          type:
          - number
          - 'null'
          minimum: -1
          maximum: 1
        ci_high:
          type:
          - number
          - 'null'
          minimum: -1
          maximum: 1
        bound_low:
          type:
          - number
          - 'null'
          minimum: -1
          maximum: 1
        bound_high:
          type:
          - number
          - 'null'
          minimum: -1
          maximum: 1
        interpretation:
          const: descriptive_no_certification
        missing_trials:
          type: integer
          minimum: 0
      required:
      - id
      - experiment_id
      - analysis_version
      - input_sha256
      - status
      - n_tasks
      - n_complete_tasks
      - delta
      - ci_low
      - ci_high
      - bound_low
      - bound_high
      - interpretation
      - missing_trials
      additionalProperties: false
    ProjectPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
          maxItems: 100
        next_cursor:
          type:
          - string
          - 'null'
      required:
      - items
      - next_cursor
      additionalProperties: false
    PackagePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Package'
          maxItems: 100
        next_cursor:
          type:
          - string
          - 'null'
      required:
      - items
      - next_cursor
      additionalProperties: false
    SuitePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Suite'
          maxItems: 100
        next_cursor:
          type:
          - string
          - 'null'
      required:
      - items
      - next_cursor
      additionalProperties: false
    PlanPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Plan'
          maxItems: 100
        next_cursor:
          type:
          - string
          - 'null'
      required:
      - items
      - next_cursor
      additionalProperties: false
    ExperimentPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Experiment'
          maxItems: 100
        next_cursor:
          type:
          - string
          - 'null'
      required:
      - items
      - next_cursor
      additionalProperties: false
    TrialPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Trial'
          maxItems: 100
        next_cursor:
          type:
          - string
          - 'null'
      required:
      - items
      - next_cursor
      additionalProperties: false
