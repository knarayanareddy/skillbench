  - bootstrap_iterations
  - practical_margin
  states: *id001
  actions:
  - id: create_fixture_suite_dialog
    operation_id: skb_create_suite
    request_schema: SuiteCreate
    validation: maintainer only; fixture scorer IDs and rights declaration
    in_flight: disable duplicate submit
    success: select created immutable suite
    failure: retain draft; no silent hidden-answer disclosure
  - id: save_plan
