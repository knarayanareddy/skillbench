name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-baseline.txt flake8

    - name: Verify Contract Manifest Integrity
      run: |
        python scripts/verify_manifest.py

    - name: Lint with flake8
      run: |
        flake8 src tests --max-line-length=120

    - name: Run Test Suite
      run: |
        pytest -v tests/

    - name: Verify Fail-Closed Release Gate
      run: |
        # In B00 baseline, release gate must exit 1 (fail-closed)
        python scripts/release_gate.py && exit 1 || echo "Gate correctly failed closed"
